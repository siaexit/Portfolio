name: Deploy portfolio pages

on:
  push:
    branches:
      - main
      - agents/figma-mcp-setup
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BtoB from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: btob

      - name: Checkout BtoC branch
        uses: actions/checkout@v4
        with:
          ref: agents/figma-mcp-setup
          path: btoc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: npm
          cache-dependency-path: |
            btob/package-lock.json
            btoc/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install and build BtoB
        working-directory: btob
        run: |
          npm ci
          npm run build

      - name: Install and build BtoC
        working-directory: btoc
        run: |
          npm ci
          npm run build -- --base=/Portfolio/btoc/

      - name: Assemble site
        run: |
          mkdir -p site/btoc
          cp -a btob/dist/. site/
          cp -a btoc/dist/. site/btoc/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
